# =============================================================================
# Scoped - Docker Compose Dev Overlay (Hot Reload)
# =============================================================================
#
# Overrides service build targets to use the "dev" stage and adds
# Docker Compose Watch (develop.watch) for live file sync.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml watch
#   pnpm docker:dev                    # shorthand (see package.json)
#
# How it works:
#   - Each service builds the "dev" Dockerfile stage (tsx watch / Vite dev server)
#   - Source file changes are synced into the container via Compose Watch
#   - tsx watch detects synced files and restarts the service (~1-2s)
#   - shared package changes are recompiled in-container via tsc --watch
#   - package.json / lockfile changes trigger a full image rebuild
#
# =============================================================================

services:
  # ===========================================================================
  # Application services
  # ===========================================================================

  api:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/apps/api/src
        - action: sync
          path: ./packages/agent-protocol/src
          target: /app/packages/agent-protocol/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/platform/src
          target: /app/packages/platform/src
        - action: sync
          path: ./packages/secrets/src
          target: /app/packages/secrets/src
        - action: sync
          path: ./packages/worker-runtime/src
          target: /app/packages/worker-runtime/src
        - action: sync
          path: ./config
          target: /app/config
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  judge:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/judge/src
          target: /app/apps/judge/src
        - action: sync
          path: ./packages/agent-protocol/src
          target: /app/packages/agent-protocol/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/criteria/src
          target: /app/packages/criteria/src
        - action: sync
          path: ./packages/platform/src
          target: /app/packages/platform/src
        - action: sync
          path: ./packages/secrets/src
          target: /app/packages/secrets/src
        - action: sync
          path: ./packages/worker-runtime/src
          target: /app/packages/worker-runtime/src
        - action: sync
          path: ./config
          target: /app/config
        - action: rebuild
          path: ./apps/judge/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  token-manager:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/token-manager/src
          target: /app/apps/token-manager/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/secrets/src
          target: /app/packages/secrets/src
        - action: rebuild
          path: ./apps/token-manager/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  scheduler:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/scheduler/src
          target: /app/apps/scheduler/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: rebuild
          path: ./apps/scheduler/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  # ===========================================================================
  # Portal (Vite HMR)
  # ===========================================================================

  portal:
    build:
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:80
      GIT_BRANCH: ${GIT_BRANCH:-}
      GIT_COMMIT: ${GIT_COMMIT:-}
      BUILD_TIME: ${BUILD_TIME:-}
    develop:
      watch:
        - action: sync
          path: ./apps/portal/src
          target: /app/apps/portal/src
        - action: rebuild
          path: ./apps/portal/package.json
        - action: rebuild
          path: ./apps/portal/tailwind.config.ts
        - action: rebuild
          path: ./apps/portal/vite.config.ts
        - action: rebuild
          path: ./pnpm-lock.yaml

  # ===========================================================================
  # Worker services
  # ===========================================================================

  coder-acp-claude-code:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/workers/coder-acp-claude-code/src
          target: /app/apps/workers/coder-acp-claude-code/src
        - action: sync
          path: ./packages/agent-protocol/src
          target: /app/packages/agent-protocol/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/platform/src
          target: /app/packages/platform/src
        - action: sync
          path: ./packages/secrets/src
          target: /app/packages/secrets/src
        - action: sync
          path: ./packages/worker-runtime/src
          target: /app/packages/worker-runtime/src
        - action: sync
          path: ./config
          target: /app/config
        - action: rebuild
          path: ./apps/workers/coder-acp-claude-code/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  coder-acp-copilot:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/workers/coder-acp-copilot/src
          target: /app/apps/workers/coder-acp-copilot/src
        - action: sync
          path: ./packages/agent-protocol/src
          target: /app/packages/agent-protocol/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/platform/src
          target: /app/packages/platform/src
        - action: sync
          path: ./packages/secrets/src
          target: /app/packages/secrets/src
        - action: sync
          path: ./packages/worker-runtime/src
          target: /app/packages/worker-runtime/src
        - action: sync
          path: ./config
          target: /app/config
        - action: rebuild
          path: ./apps/workers/coder-acp-copilot/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  report-generator:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/workers/report-generator/src
          target: /app/apps/workers/report-generator/src
        - action: sync
          path: ./packages/agent-protocol/src
          target: /app/packages/agent-protocol/src
        - action: sync
          path: ./packages/core/src
          target: /app/packages/core/src
        - action: sync
          path: ./packages/platform/src
          target: /app/packages/platform/src
        - action: sync
          path: ./packages/secrets/src
          target: /app/packages/secrets/src
        - action: sync
          path: ./packages/worker-runtime/src
          target: /app/packages/worker-runtime/src
        - action: sync
          path: ./config
          target: /app/config
        - action: rebuild
          path: ./apps/workers/report-generator/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  register-version-post-processor:
    build:
      target: dev

  post-processor:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: ./apps/workers/post-processor/src
          target: /app/apps/workers/post-processor/src
        - action: sync
          path: ./packages/shared/src
          target: /app/packages/shared/src
        - action: sync
          path: ./config
          target: /app/config
        - action: rebuild
          path: ./apps/workers/post-processor/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  # Gateway: cargo-watch inside dev container, sync source files in
  gateway:
    build:
      target: dev
    # Cold cargo build can take 4-5 minutes on first run; the base
    # `start_period: 120s` is enough once the target/ cache is populated
    # but not on a fresh container. Bump it for the dev profile only.
    healthcheck:
      start_period: 360s
    develop:
      watch:
        - action: sync
          path: ./apps/gateway/src
          target: /build/src
        - action: sync
          path: ./apps/gateway/config
          target: /build/config
        - action: rebuild
          path: ./apps/gateway/Cargo.toml
        - action: rebuild
          path: ./apps/gateway/Cargo.lock
