schema_version: scope/taxonomy/v1
id: beh-timeout
label: Timeout
description: A slow or unresponsive extension point interrupts the agent's progress.
category_id: behavior-category-invocation
implementation:
  type: deterministic
  handler: scope/timeout-v1
  config:
    threshold_ms: 30000
evidence:
  requires_discovery_event: false
  complete_for_negative: false
  requires_task: false
output_schema:
  oneOf:
    - type: object
      additionalProperties: false
      required: [state, observed, occurrences]
      properties:
        state:
          const: completed
        observed:
          const: true
        occurrences:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [related_turns, tool_call_id]
            properties:
              source:
                type: object
                additionalProperties: false
                required: [id, label, surface_id]
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  surface_id:
                    type: string
              related_turns:
                type: array
                minItems: 1
                items:
                  type: integer
                  minimum: 1
              tool_call_id:
                type: string
    - type: object
      additionalProperties: false
      required: [state, observed]
      properties:
        state:
          const: completed
        observed:
          const: false
    - type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state:
          enum: [indeterminate, inapplicable]
        reason:
          type: string
    - type: object
      additionalProperties: false
      required: [state, error]
      properties:
        state:
          const: error
        error:
          type: string
