[project]
name = "scope-static-prompt-evals"
version = "0.1.0"
description = "Quality and red-team evaluations for Scope AI prompt surfaces"
requires-python = ">=3.11"
dependencies = [
  "azure-ai-evaluation>=1.18,<1.19",
  "azure-ai-projects>=2,<3",
  "azure-identity>=1.25,<2",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/static_prompt_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
