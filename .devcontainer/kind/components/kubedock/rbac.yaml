apiVersion: v1
kind: Namespace
metadata:
  name: scope-dev-tasks
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.32
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedock-task
  namespace: scope-dev-tasks
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedock
  namespace: scope-dev-tasks
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims, events]
    verbs: [get, list, watch, create, delete, patch, update]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach, pods/portforward]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedock
  namespace: scope-dev-tasks
subjects:
  - kind: ServiceAccount
    name: coder-acp-copilot
    namespace: scope-dev
  - kind: ServiceAccount
    name: coder-acp-claude-code
    namespace: scope-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubedock