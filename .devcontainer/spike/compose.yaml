services:
  certs-init:
    image: ghcr.io/cmaneu/entra-local@sha256:70584ef110914d100409cb3d63a63548ccdde10ca780f9751755f1482dec5d7e
    user: root
    entrypoint: ["sh", "-ec"]
    command:
      - "cp /source/* /certs/; chown -R 1000:1000 /certs; chmod 755 /certs; chmod 644 /certs/*.pem; chmod 640 /certs/*-key.pem"
    volumes:
      - ${SPIKE_CERT_DIR:?required}:/source:ro
      - certs:/certs
  entra-local:
    image: ghcr.io/cmaneu/entra-local@sha256:70584ef110914d100409cb3d63a63548ccdde10ca780f9751755f1482dec5d7e
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?required}
      ISSUER: ${ISSUER:?required}
      TENANT_ID: ${AUTH_TENANT_ID:?required}
      TLS_ENABLED: "true"
      TLS_CERT: /certs/edge.pem
      TLS_KEY: /certs/edge-key.pem
      NODE_EXTRA_CA_CERTS: /certs/rootCA.pem
    ports:
      - "127.0.0.1:${SPIKE_ENTRA_PORT:?required}:8443"
    volumes:
      - data:/app/data
      - certs:/certs:ro
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:8443/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  dev-edge:
    image: nginx@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    network_mode: host
    volumes:
      - ${SPIKE_EDGE_CONFIG:?required}:/etc/nginx/conf.d/default.conf:ro
      - certs:/certs:ro
      - ${SPIKE_CERT_DIR:?required}/rootCA.pem:/ca/rootCA.pem:ro
    depends_on:
      entra-local:
        condition: service_healthy
volumes:
  data:
  certs: