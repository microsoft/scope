name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  test:
    name: Build & Test CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve current CLI version from git tag
        working-directory: apps/cli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(gh api repos/${{ github.repository }}/git/matching-refs/tags/cli/v \
            --jq '[.[].ref | sub("refs/tags/cli/v"; "")] | sort_by(split(".") | map(tonumber)) | last')
          if [ -z "$CURRENT" ] || [ "$CURRENT" = "null" ]; then
            echo "::error::No cli/v* tag found. Create an initial tag (e.g. cli/v0.0.0) before publishing."
            exit 1
          fi
          echo "Resolved current CLI version from tag: ${CURRENT}"
          pnpm version "${CURRENT}" --no-git-tag-version --allow-same-version

      - name: Bump version
        id: version
        working-directory: apps/cli
        run: |
          NEW_VERSION=$(pnpm version ${{ inputs.bump }} --no-git-tag-version | tr -d 'v')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build CLI bundle
        env:
          SCOPE_DEFAULT_API_URL: ${{ vars.SCOPE_API_URL }}
        run: pnpm build:cli

      - name: Run integration tests
        run: pnpm vitest run --config vitest.integration.config.ts apps/cli/src/bundle.integration.test.ts

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: cli-bundle
          path: apps/cli/dist/scope.mjs

    outputs:
      version: ${{ steps.version.outputs.version }}

  publish:
    name: Publish Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: cli-bundle
          path: apps/cli/dist

      - name: Create tag
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "cli/v${VERSION}" -m "CLI release v${VERSION}"
          git push origin "cli/v${VERSION}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          gh release create "cli/v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scope CLI v${VERSION}" \
            --notes "## Installation

          \`\`\`bash
          gh api repos/${GITHUB_REPOSITORY}/contents/website/install-cli.sh -H \"Accept: application/vnd.github.raw\" | bash
          \`\`\`

          Or download \`scope.mjs\` from this release and place it in your PATH.

          Requires Node.js >= 20." \
            apps/cli/dist/scope.mjs
