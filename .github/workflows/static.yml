# Workflow for building and deploying the Astro/Starlight site to GitHub Pages
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/static.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          package_json_file: website/package.json
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: |
            website/node_modules/.astro
            website/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}-${{ hashFiles('website/src/**') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}-
            astro-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Setup Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          SITE: ${{ steps.pages.outputs.origin || 'https://microsoft.github.io' }}
          BASE_PATH: ${{ github.ref != 'refs/heads/main' && '/scope' || steps.pages.outputs.base_path }}
        run: pnpm run build
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
