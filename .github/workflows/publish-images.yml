name: Publish core images to GHCR

# Builds and publishes the 6 core Scope app images (NOT the two ACP
# coding-agent workers, which are built/pushed to the Bicep-provisioned ACR
# as a separate step — see deploy/helm/scope/README.md "Phase 3") to GHCR,
# so the Helm chart under deploy/helm/scope/ can install the app straight
# from ghcr.io/<owner>/scope-<service> with no private registry required.
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/judge/**"
      - "apps/token-manager/**"
      - "apps/scheduler/**"
      - "apps/portal/**"
      - "apps/workers/report-generator/**"
      - "packages/shared/**"
      - "packages/db-migrations/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    # Fork PRs never trigger this workflow (push to main / manual dispatch
    # only), so there's no need for the ci.yml TRUSTED_CODE gate here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: scope-api
            dockerfile: apps/api/Dockerfile
          - name: scope-judge
            dockerfile: apps/judge/Dockerfile
          - name: scope-token-manager
            dockerfile: apps/token-manager/Dockerfile
          - name: scope-scheduler
            dockerfile: apps/scheduler/Dockerfile
          - name: scope-portal
            dockerfile: apps/portal/Dockerfile
          - name: scope-report-generator
            dockerfile: apps/workers/report-generator/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (production image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || '' }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image.name }}

      # The db-migrate Helm Job runs migrations via the api Dockerfile's
      # `builder` stage (full TS source + tsx) — the slim production image
      # above only ships packages/db-migrations/dist, which mongo-migrate-ts's
      # CLI can't use (see deploy/helm/scope/templates/jobs/db-migrate.yaml).
      - name: Build and push (api builder stage, for db-migrate job)
        if: matrix.image.name == 'scope-api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: builder
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/scope-api:builder
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/scope-api:builder-${{ github.sha }}
          cache-from: type=gha,scope=scope-api-builder
          cache-to: type=gha,mode=min,scope=scope-api-builder
