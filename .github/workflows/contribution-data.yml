# Publishes default-branch commit contributors to the orphan `website-data`
# branch. The docs site fetches the deterministic JSONL at runtime.
name: Publish website contribution data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-contribution-data
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'microsoft/scope'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DATA_BRANCH: website-data
    steps:
      - name: Collect contributors
        run: |
          set -euo pipefail
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${REPO}/commits?sha=${DEFAULT_BRANCH}&per_page=100" \
            --jq '.[]' |
            jq -cS -s '
              map(select(
                .author != null
                and .author.type == "User"
                and (.author.login | endswith("[bot]") | not)
              ))
              | group_by(.author.login | ascii_downcase)
              | map(
                  | {
                      commits: length,
                      login: .[0].author.login
                    }
                )
              | sort_by(.login | ascii_downcase)
              | .[]' > contributors.jsonl

      - name: Publish website data
        run: |
          set -euo pipefail
          git init -q data
          cd data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin "$DATA_BRANCH" 2>/dev/null; then
            git checkout -q -B "$DATA_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$DATA_BRANCH"
          fi
          cp ../contributors.jsonl .
          git add contributors.jsonl
          if git diff --cached --quiet; then
            echo 'No website data changes.'
            exit 0
          fi
          git commit -q -m 'Update website contribution data'
          git push -q origin "HEAD:$DATA_BRANCH"
