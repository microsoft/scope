name: Secret Scan

# Scans the repository for committed secrets/keys using the gitleaks CLI.
#
# We invoke the pinned gitleaks *binary* directly (not gitleaks/gitleaks-action)
# on purpose: the official action requires a GITLEAKS_LICENSE for organization-
# owned repositories (the gate is org-vs-personal, NOT public-vs-private), whereas
# the CLI is licence-free. This keeps the scan fully self-contained — no org
# secret and no Actions allow-list entry are needed (only GitHub-authored actions
# are used, which the org policy already permits).
#
# Allowlisting of the known-benign false positives lives in /.gitleaks.toml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full-history sweep (Mondays 07:00 UTC): catches anything reachable
    # only from history and re-scans as gitleaks' default rules evolve.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Least privilege: read the repo contents; write security events so the SARIF report
# can be published to the Security tab as code-scanning alerts. actions:read lets
# codeql-action/upload-sarif read the workflow run (required for private repos).
permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin the exact gitleaks version verified against this repo's full history
  # (181 false positives -> 0 with .gitleaks.toml). Bump deliberately — never a
  # floating tag — and update GITLEAKS_SHA256 below whenever you change it.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so both the PR commit range and --log-opts="--all" work.
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "Downloading ${url}"
          curl -fsSL -o "${tarball}" "${url}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          rm -f "${tarball}"
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          common=(--config .gitleaks.toml --redact --no-banner --exit-code 1 --report-format sarif --report-path results.sarif)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            echo "Scanning PR commit range ${range}"
            gitleaks git . --log-opts="${range}" "${common[@]}"
          else
            echo "Scanning full history (--all)"
            gitleaks git . --log-opts="--all" "${common[@]}"
          fi

      - name: Upload SARIF to code scanning
        # Publish findings as code-scanning alerts in the Security tab (the payoff of the
        # SARIF format). Runs even when the scan step failed on leaks (!cancelled), only when
        # a SARIF was actually produced, and is skipped for fork PRs — which don't receive
        # security-events: write (the scan step still gates the check there).
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif-report
          path: results.sarif
          if-no-files-found: ignore
