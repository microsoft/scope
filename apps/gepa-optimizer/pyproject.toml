[project]
name = "gepa-optimizer"
version = "0.1.0"
description = "GEPA prompt-optimization driver that optimizes AGENTS.md files evaluated by real Scope benchmark runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gepa>=0.1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "litellm>=1.0",
]

[project.scripts]
gepa-optimizer = "gepa_optimizer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gepa_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
