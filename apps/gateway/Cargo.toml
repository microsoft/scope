[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "TLS-intercepting HTTP proxy with plugin architecture"
# First-party application crate — never published to crates.io. Marked private
# so license tooling (cargo-about) excludes it from the third-party NOTICE.
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "client-legacy"] }
http-body-util = "0.1"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
anyhow = "1"
thiserror = "2"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
http = "1"
bytes = "1"
async-trait = "0.1"
dashmap = "6"
lru = "0.16"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
backon = "1"
hmac = "0.12"
sha2 = "0.10"
azure_storage = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls", "hmac_rust"] }
azure_storage_blobs = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls"] }
fred = { version = "10", features = ["tracing", "enable-rustls", "i-scripts"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", features = ["rustls-tls-native-roots", "json", "stream"] }
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
