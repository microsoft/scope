{{- if .Values.jobs.dbMigrate.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scope.componentName" (dict "component" "db-migrate" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migrate
  annotations:
    # Mirrors docker-compose's `depends_on: db-migrate: condition:
    # service_completed_successfully`. Re-run on every `helm upgrade` too,
    # since new migrations can ship with any release.
    #
    # Must be post-install/post-upgrade, NOT pre-install/pre-upgrade: Helm
    # creates every pre-install/pre-upgrade hook BEFORE any regular release
    # resource exists, so a pre-install db-migrate Job would run before the
    # ServiceAccount (workload identity) and SecretProviderClass (Key Vault
    # CSI sync) templates below even exist — the pod can't authenticate or
    # mount `kv-secrets`, and `envFrom.secretRef: scope-secrets` fails with
    # "secret not found". Running post-install/post-upgrade instead means
    # those regular resources are already applied, at the cost of api/
    # judge/scheduler/token-manager pods starting up slightly before
    # migrations finish (acceptable: these services retry transient DB
    # errors — see the `resilience` skill's retry/backoff conventions used
    # throughout this codebase).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "scope.selectorLabels" (dict "component" "db-migrate" "context" .) | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "scope.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # packages/db-migrations' migrate:up script runs its .ts migrations
        # directly via tsx, so this must use the Dockerfile's `builder`
        # stage (full TS source + dev deps) rather than the slim production
        # scope-api image, which only ships compiled dist/ (no src/, no
        # tsx) — see jobs.dbMigrate.image.tag default ("builder") in
        # values.yaml.
        - name: db-migrate
          image: {{ include "scope.image" (dict "image" .Values.jobs.dbMigrate.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          workingDir: /app
          command: ["pnpm", "--filter", "db-migrations", "migrate:up"]
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.k8sSecretName }}
          volumeMounts:
            # Not read directly by migrate:up — mounting the CSI volume is
            # what makes the Secrets Store CSI driver sync the Key Vault
            # secrets into the `scope-secrets` K8s Secret before this
            # container starts, which `envFrom.secretRef` below depends on.
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "scope.componentName" (dict "component" "azure-kv" "context" .) }}
{{- end -}}
