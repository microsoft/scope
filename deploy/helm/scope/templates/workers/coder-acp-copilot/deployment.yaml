{{- if .Values.workers.coderAcpCopilot.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scope.componentName" (dict "component" "coder-acp-copilot" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: coder-acp-copilot
spec:
  replicas: {{ .Values.workers.coderAcpCopilot.replicas }}
  selector:
    matchLabels:
      {{- include "scope.selectorLabels" (dict "component" "coder-acp-copilot" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scope.selectorLabels" (dict "component" "coder-acp-copilot" "context" .) | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      # Worker-scoped identity (Storage Blob/Queue only — no Key Vault
      # access), not the shared backend ServiceAccount: this pod runs
      # benchmark-controlled agent code and must not be able to reach Key
      # Vault. See WORKERS.md "Worker identity isolation".
      serviceAccountName: {{ include "scope.workerServiceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.workers.coderAcpCopilot.mcpGateway.enabled }}
      # Native sidecar (GA since K8s 1.29): kubelet starts this before the
      # main container and holds the Pod at NotReady until its readiness
      # probe passes, so the worker's first task never races an MCP-gateway
      # that isn't listening yet. Mirrors compose's
      # mcp-gateway-copilot `depends_on: service_healthy`.
      initContainers:
        - name: mcp-gateway
          restartPolicy: Always
          image: {{ include "scope.image" (dict "image" .Values.workers.coderAcpCopilot.mcpGateway.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Suppress MCPJungle's ASCII-art banner (written to stderr).
          command: ["/bin/sh", "-c"]
          args: ["/mcpjungle start 2>&1 | grep --line-buffered -v '[█═╗╚║╔╝]' >&2"]
          env:
            - name: SESSION_IDLE_TIMEOUT_SEC
              value: "0"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            {{- toYaml .Values.workers.coderAcpCopilot.mcpGateway.resources | nindent 12 }}
      {{- end }}
      containers:
        # Pure background Storage Queue consumer — no HTTP server/port, so
        # no Service or readiness/liveness HTTP probes (see
        # apps/workers/coder-acp-copilot/src/index.ts).
        #
        # NOT templated here (see docs/architecture/worker-requirements.md
        # and docs/architecture/kubedock.md): the AI Gateway/DevProxy
        # sidecar (HAR capture) and Kubedock (in-task `docker
        # build`/`docker run` support). The worker runs without them —
        # scenarios that need in-task Docker access are not yet supported
        # by this chart. Follow up once those sidecars have a templated
        # pattern.
        - name: coder-acp-copilot
          image: {{ include "scope.image" (dict "image" .Values.workers.coderAcpCopilot.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "scope.componentName" (dict "component" "common-env" "context" .) }}
            - secretRef:
                # Supplies MONGO_CONNECTION_STRING/REDIS_PASSWORD always, and
                # GITHUB_TOKEN as a fallback only if secrets.keyVaultSecretNames.githubToken
                # is populated. The worker prefers acquiring its GitHub
                # credential dynamically from Token Manager at runtime (see
                # "Read credentials via Token Manager" in
                # docs/architecture/worker-requirements.md) — register one
                # via the Portal's **Secrets** tab (**Register key**) or
                # `POST /api/v1/keys` instead of populating this secret,
                # unless you specifically want the static-env-var fallback.
                name: {{ .Values.secrets.k8sSecretName }}
          env:
            - name: WORKER_NAME
              value: coder-acp-copilot
            # Must exactly match the agentVersion registered via
            # scripts/register-agent.sh (see deploy/helm/scope/README.md
            # "Phase 3") — the queue processor refuses to start otherwise.
            - name: SCOPE_AGENT_VERSION
              value: {{ .Values.workers.coderAcpCopilot.agentVersion | quote }}
            - name: QUEUE_NAME
              value: {{ .Values.workers.coderAcpCopilot.queueName | quote }}
            {{- if .Values.workers.coderAcpCopilot.mcpGateway.enabled }}
            # Same Pod, so the sidecar is reachable over loopback — no
            # Service object needed.
            - name: MCP_GATEWAY_URL
              value: http://localhost:8080
            {{- end }}
          {{- if .Values.workers.coderAcpCopilot.mcpGateway.enabled }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          {{- end }}
          resources:
            {{- toYaml .Values.workers.coderAcpCopilot.resources | nindent 12 }}
      {{- if .Values.workers.coderAcpCopilot.mcpGateway.enabled }}
      volumes:
        # Shared with the mcp-gateway sidecar — mirrors compose's
        # copilot_workspace named volume. No kv-secrets CSI volume here:
        # see the identity note above.
        - name: workspace
          emptyDir: {}
      {{- end }}
{{- end -}}
