{{- if .Values.workers.reportGenerator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scope.componentName" (dict "component" "report-generator" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: report-generator
spec:
  replicas: {{ .Values.workers.reportGenerator.replicas }}
  selector:
    matchLabels:
      {{- include "scope.selectorLabels" (dict "component" "report-generator" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scope.selectorLabels" (dict "component" "report-generator" "context" .) | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "scope.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # Pure background Storage Queue consumer — no HTTP server/port, so
        # no Service or readiness/liveness HTTP probes (see
        # apps/workers/report-generator/src/index.ts).
        - name: report-generator
          image: {{ include "scope.image" (dict "image" .Values.workers.reportGenerator.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "scope.componentName" (dict "component" "common-env" "context" .) }}
            - secretRef:
                name: {{ .Values.secrets.k8sSecretName }}
          env:
            - name: REPORT_MODEL
              value: {{ .Values.workers.reportGenerator.reportModel | quote }}
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            {{- toYaml .Values.workers.reportGenerator.resources | nindent 12 }}
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "scope.componentName" (dict "component" "azure-kv" "context" .) }}
{{- end -}}
