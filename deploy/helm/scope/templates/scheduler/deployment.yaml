{{- if .Values.scheduler.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scope.componentName" (dict "component" "scheduler" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "scope.selectorLabels" (dict "component" "scheduler" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scope.selectorLabels" (dict "component" "scheduler" "context" .) | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "scope.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scheduler
          image: {{ include "scope.image" (dict "image" .Values.scheduler.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.scheduler.port }}
          envFrom:
            - configMapRef:
                name: {{ include "scope.componentName" (dict "component" "common-env" "context" .) }}
            - secretRef:
                name: {{ .Values.secrets.k8sSecretName }}
          env:
            - name: PORT
              value: {{ .Values.scheduler.port | quote }}
            - name: SCHEDULER_TARGET_QUEUE_DEPTH
              value: "2"
            - name: SCHEDULER_POLL_INTERVAL_MS
              value: "2000"
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          # The scheduler's health server returns 200 on every path (no
          # dedicated /health route) — see apps/scheduler/src/index.ts.
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "scope.componentName" (dict "component" "azure-kv" "context" .) }}
{{- end -}}
