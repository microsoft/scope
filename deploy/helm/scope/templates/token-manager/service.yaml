{{- if .Values.tokenManager.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "scope.componentName" (dict "component" "token-manager" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-manager
spec:
  selector:
    {{- include "scope.selectorLabels" (dict "component" "token-manager" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.tokenManager.port }}
      targetPort: http
{{- end -}}
