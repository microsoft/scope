apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scope.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required "azure.workloadIdentityClientId is required (see deploy/azure output workloadIdentityClientId)" .Values.azure.workloadIdentityClientId | quote }}
{{- if or .Values.workers.coderAcpCopilot.enabled .Values.workers.coderAcpClaudeCode.enabled }}
---
# Narrower identity for the ACP workers (Storage Blob/Queue only — no Key
# Vault access), so benchmark-controlled agent code never runs under the
# backend's Key Vault Secrets Officer identity. See WORKERS.md "Worker
# identity isolation".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "scope.workerServiceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required "azure.workerWorkloadIdentityClientId is required when workers are enabled (see deploy/azure output workerWorkloadIdentityClientId)" .Values.azure.workerWorkloadIdentityClientId | quote }}
{{- end }}
