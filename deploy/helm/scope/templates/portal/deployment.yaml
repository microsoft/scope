{{- if .Values.portal.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scope.componentName" (dict "component" "portal" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal
spec:
  replicas: {{ .Values.portal.replicas }}
  selector:
    matchLabels:
      {{- include "scope.selectorLabels" (dict "component" "portal" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "scope.selectorLabels" (dict "component" "portal" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portal
          image: {{ include "scope.image" (dict "image" .Values.portal.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.portal.port }}
          env:
            # Nginx serves purely static, pre-built assets — no Azure
            # identity, Key Vault secrets, or backend env vars are needed
            # here. Only these two toggles are read at container start by
            # docker-entrypoint.sh (see apps/portal/docker-entrypoint.sh).
            - name: SCOPE_AUTH_ENABLED
              value: {{ .Values.portal.authEnabled | quote }}
            {{- if .Values.portal.docsBaseUrl }}
            - name: SCOPE_DOCS_BASE_URL
              value: {{ .Values.portal.docsBaseUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
{{- end -}}
