{{/*
Secrets Store CSI driver SecretProviderClass: syncs the Key Vault secrets
listed in Values.secrets.keyVaultSecretNames into a single K8s Secret
(Values.secrets.k8sSecretName) via secretObjects, so application Deployments
can consume them with a plain `envFrom.secretRef` instead of mounting the CSI
volume individually. At least one Pod must still mount this SecretProviderClass
as a volume for the sync to occur (see the `kv-secrets` volume on the `api`
Deployment) — the Secrets Store CSI driver syncs on volume mount, not
continuously in the background.

Uses workload identity (clientID) rather than pod identity or the VM's
system-assigned identity, matching the Bicep template's AKS configuration.

Any `secrets.keyVaultSecretNames.<logical>` entry set to an empty string is
skipped entirely (not requested from Key Vault, not synced into the K8s
Secret). This lets optional secrets (e.g. `githubToken`, `anthropicApiKey`,
needed only by the Phase 3 worker images / portal AI features) be omitted
with `--set secrets.keyVaultSecretNames.anthropicApiKey=""` until they're
actually created in the vault — otherwise the Azure provider fails the
*entire* CSI mount (for every secret, not just the missing one) if any
listed object doesn't exist.
*/}}
{{- $logicalToEnvKey := dict
      "mongoConnectionString" "MONGO_CONNECTION_STRING"
      "redisPassword" "REDIS_PASSWORD"
      "githubToken" "GITHUB_TOKEN"
      "anthropicApiKey" "ANTHROPIC_API_KEY"
-}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "scope.componentName" (dict "component" "azure-kv" "context" .) }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "scope.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.secrets.k8sSecretName }}
      type: Opaque
      data:
        {{- range $logical, $kvObjectName := .Values.secrets.keyVaultSecretNames }}
        {{- $envKey := get $logicalToEnvKey $logical }}
        {{- if and $envKey $kvObjectName }}
        - objectName: {{ $kvObjectName }}
          key: {{ $envKey }}
        {{- end }}
        {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ required "azure.workloadIdentityClientId is required" .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ required "azure.keyVaultName is required (see deploy/azure output keyVaultName)" .Values.azure.keyVaultName | quote }}
    tenantId: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
    objects: |
      array:
        {{- range $logical, $kvObjectName := .Values.secrets.keyVaultSecretNames }}
        {{- if $kvObjectName }}
        - |
          objectName: {{ $kvObjectName }}
          objectType: secret
        {{- end }}
        {{- end }}
